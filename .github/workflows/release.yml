name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0 (empty: only build)'
        required: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install reportlab pillow
      - name: Build
        env:
          TAGIN: ${{ github.event.inputs.tag }}
        run: |
          tag="${TAGIN:-$GITHUB_REF_NAME}"; [ "$GITHUB_REF_TYPE" = "tag" ] || tag="${TAGIN:-dev}"
          d="out/SynthCookBook-$tag"; mkdir -p "$d/patches"
          cp docs/recipe-book.html "$d/SynthCookBook-RecipeBook.html"
          python3 tools/build_offline.py "$d/SynthCookBook-PatchBook.html"
          python3 tools/make_manual.py x docs/manual.txt "$d/SynthCookBook-manual.pdf"
          cp docs/patches/*.json "$d/patches/"; cp docs/PATCH-FORMAT.md docs/SHARING.md LICENSE packaging/INSTALL.txt "$d/"
          (cd "$d" && find . -type f | sort | xargs sha256sum > SHA256SUMS)
          (cd out && zip -r "SynthCookBook-$tag.zip" "SynthCookBook-$tag")
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-zip, path: "out/*.zip" }
      - name: Publish pre-release
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="out/SynthCookBook-$TAG.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$f" --clobber
          else gh release create "$TAG" "$f" --target "$GITHUB_SHA" --prerelease --title "Synth Cook Book $TAG" --notes "Offline recipe book for 14 hardware synths without patch memory (Behringer, Moog, Arturia, Korg): unzip and open SynthCookBook-RecipeBook.html. Includes the manual, the patch format and the patches as JSON. Works offline."; fi
